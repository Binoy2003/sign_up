<!DOCTYPE html>
<html lang="en">
  <head>


  </head>
<body>
  <h1 style="text-align: center;"> Sign Up</h1>
  <hr>
  <br>
  <label for="user">Name:</label>
  <input type="text" id="user" name="user" placeholder="user name"> <br>
  <label for="email">Email:</label>
  <input type="email" id="email" name="usermail" placeholder="user mail" required><br>
  <label for="pass">Password:</label>
  <input type="password" id="pass" name="password" placeholder="Password"><br>
  <label for="phn">Phone:</label><br>
  <select name="code">
    <option value="+880">+880</option>
    <option value="+960">+960</option>
    <option value="+1">+1</option>
    <option value="+44">+44</option>
    <option value="+1684">+1684</option>
    <option value="+376">+376</option>
    <option value="+244">+244</option>
  </select>
    <input type="number" id="phn" name="phone" placeholder="0123456789" required>
    <br>
    <label for="country">Country</label>
    <input list="con">
    <datalist id="con">
      <option value="Bangladesh"></option>
      <option value="India"></option>
      <option value="Canada"></option>
      <option value="USA"></option>
      <option value="Japan"></option>
    </datalist>
    <br>
    Gender:
    <input type="radio"  name="gender"> 
    <label for="gnd1">Male</label>
    <input type="radio"  name="gender"> 
    <label for="gnd2">Female</label>
    <br>
    <label for="date">Date of Birth</label>
    <input type="date" id="date" name="dob">
    <br>
    <label for="time">Time</label>
    <input type="time" id="time" name="tm">
    <br>
    <label for="colors">Colors</label>
    <input type="color" id="colors" name="col">
    <br>
    <label for="file">Choose Photo</label>
    <input type="file" id="file" name="f1">
    <br>
    <input type="checkbox" id="program1" name="pro">
    <label for="program1">Bsc</label>
    <input type="checkbox" id="program2" name="pro">
    <label for="program2">Msc</label>
    <br>
    <textarea name="comment" cols="30" rows="10">Share your user experience</textarea>
    <br>
    <input type="submit" value="Send">
    <input type="reset" value="Reset">
    <br>
    <br>
    <p>Thank You</p>
</body>


</html>
